<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Assistant — Tool Calling</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 780px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      background: #16162a;
      border-radius: 20px;
      border: 1px solid #2a2a45;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .header {
      background: linear-gradient(135deg, #6c3de8, #3d86f5);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header .logo { font-size: 28px; }
    .header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .header p { font-size: 12px; color: rgba(255,255,255,0.75); }

    .tools-bar {
      background: #1e1e35;
      padding: 8px 20px;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid #2a2a45;
    }

    .tool-badge {
      background: #2a2a45;
      border: 1px solid #3d3d60;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: #a0a0c0;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #3a3a55; border-radius: 3px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-start; }
    .msg.assistant { align-self: flex-end; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    .msg.user .bubble {
      background: #2a2a45;
      border-bottom-right-radius: 4px;
      color: #c8c8e8;
    }

    .msg.assistant .bubble {
      background: linear-gradient(135deg, #3d1e88, #1a4fa8);
      border-bottom-left-radius: 4px;
      color: #f0f0ff;
    }

    .tool-info {
      margin-top: 6px;
      background: #1e1e35;
      border: 1px solid #3d3d60;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      color: #8888bb;
    }

    .tool-info .tool-name {
      color: #7b6cf6;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .tool-info .tool-result {
      color: #60a0c0;
      font-size: 11px;
      white-space: pre-wrap;
      max-height: 80px;
      overflow-y: auto;
    }

    .timestamp {
      font-size: 10px;
      color: #555570;
      margin-top: 4px;
      padding: 0 4px;
    }

    .msg.user .timestamp { text-align: right; }
    .msg.assistant .timestamp { text-align: left; }

    .typing {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: #1e1e35;
      border-radius: 16px;
      width: fit-content;
      align-self: flex-end;
    }

    .typing span {
      width: 8px; height: 8px;
      background: #7b6cf6;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }

    .input-area {
      padding: 16px 20px;
      background: #1a1a2e;
      border-top: 1px solid #2a2a45;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      background: #2a2a45;
      border: 1px solid #3d3d60;
      border-radius: 14px;
      color: #e0e0e0;
      padding: 12px 16px;
      font-size: 14px;
      resize: none;
      outline: none;
      font-family: inherit;
      max-height: 120px;
      min-height: 46px;
      line-height: 1.5;
      transition: border 0.2s;
    }

    textarea:focus { border-color: #7b6cf6; }

    textarea::placeholder { color: #555570; }

    button#send-btn {
      background: linear-gradient(135deg, #6c3de8, #3d86f5);
      border: none;
      border-radius: 14px;
      color: white;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 18px;
      transition: opacity 0.2s, transform 0.1s;
      height: 46px;
      min-width: 52px;
    }

    button#send-btn:hover { opacity: 0.85; }
    button#send-btn:active { transform: scale(0.96); }
    button#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .welcome {
      text-align: center;
      padding: 40px 20px;
      color: #555570;
    }

    .welcome .icon { font-size: 48px; margin-bottom: 12px; }
    .welcome h2 { font-size: 18px; margin-bottom: 8px; color: #8888aa; }
    .welcome p { font-size: 13px; }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    .suggestion {
      background: #2a2a45;
      border: 1px solid #3d3d60;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      color: #a0a0c0;
      transition: all 0.2s;
    }

    .suggestion:hover {
      background: #3d3d60;
      color: #c0c0e0;
      border-color: #7b6cf6;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="logo">🤖</div>
    <div>
      <h1>AI Assistant</h1>
      <p>Powered by qwen3 + Tool Calling</p>
    </div>
  </div>

  <div class="tools-bar">
    <div class="tool-badge">🌤️ get_weather</div>
    <div class="tool-badge">🔍 search_web</div>
    <div class="tool-badge" id="status-badge">⚡ Ready</div>
  </div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <div class="icon">✨</div>
      <h2>Hello! How can I help you today?</h2>
      <p>I'm an AI assistant with tools for research and weather.</p>
      <div class="suggestions">
        <div class="suggestion" onclick="fillInput(this)">🌤️ What's the weather in Cairo?</div>
        <div class="suggestion" onclick="fillInput(this)">🏆 Who won CAF Cup 2025?</div>
        <div class="suggestion" onclick="fillInput(this)">🌤️ Weather in London</div>
        <div class="suggestion" onclick="fillInput(this)">📰 Latest AI news</div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea
      id="user-input"
      placeholder="Ask anything..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>
  // ← غيّر هذا الرابط لرابط الـ API الخاص بك بعد النشر
  const API_URL = "http://localhost:8000";
  let history = [];
  let isLoading = false;

  function fillInput(el) {
    document.getElementById("user-input").value = el.textContent.replace(/^[^\s]+\s/, "");
    document.getElementById("user-input").focus();
  }

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function getTime() {
    return new Date().toLocaleTimeString("ar", { hour: "2-digit", minute: "2-digit" });
  }

  function addMessage(role, text, toolUsed = null, toolResult = null) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${role}`;

    let html = `<div class="bubble">${text.replace(/\n/g, "<br>")}</div>`;

    if (toolUsed) {
      html += `
        <div class="tool-info">
          <div class="tool-name">🔧 Used: ${toolUsed}</div>
          <div class="tool-result">${toolResult || ""}</div>
        </div>`;
    }

    html += `<div class="timestamp">${getTime()}</div>`;
    div.innerHTML = html;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    div.id = "typing";
    div.className = "typing";
    div.innerHTML = `<span></span><span></span><span></span>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById("typing");
    if (el) el.remove();
  }

  async function sendMessage() {
    if (isLoading) return;
    const input = document.getElementById("user-input");
    const msg = input.value.trim();
    if (!msg) return;

    addMessage("user", msg);
    input.value = "";
    input.style.height = "auto";

    isLoading = true;
    document.getElementById("send-btn").disabled = true;
    document.getElementById("status-badge").textContent = "⏳ Processing...";
    showTyping();

    try {
      const res = await fetch(`${API_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, history })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      hideTyping();
      addMessage("assistant", data.answer, data.tool_used, data.tool_result);

      history.push({ role: "user", content: msg });
      history.push({ role: "assistant", content: data.answer });

      if (history.length > 12) history = history.slice(-12);

    } catch (err) {
      hideTyping();
      addMessage("assistant", `❌ Error: ${err.message}\n\nتأكد أن الـ API يعمل على: ${API_URL}`);
    }

    isLoading = false;
    document.getElementById("send-btn").disabled = false;
    document.getElementById("status-badge").textContent = "⚡ Ready";
  }
</script>
</body>
</html>
